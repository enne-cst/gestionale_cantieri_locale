<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubo Suite – Gestione Cantieri</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
  <div id="app"><div style="padding:30px;color:#5b6573">Caricamento…</div></div>

  <script src="js/engine.js"></script>
  <script src="js/alert-catalogo.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/dati.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/format.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/importa-commesse.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/page-dashboard.js"></script>
  <script src="js/page-analisi.js"></script>
  <script src="js/page-commesse.js"></script>
  <script src="js/page-importa.js"></script>
  <script src="js/page-commessa.js"></script>
  <script src="js/page-gantt.js"></script>
  <script src="js/page-movimenti.js"></script>
  <script src="js/page-costi.js"></script>
  <script src="js/page-budget.js"></script>
  <script src="js/page-sostenibilita.js"></script>
  <script src="js/page-preventivi.js"></script>
  <script src="js/page-saldi.js"></script>
  <script src="js/page-cantieri.js"></script>
  <script src="js/page-parametri.js"></script>
  <script src="js/page-registro.js"></script>
  <script src="js/page-guida-alert.js"></script>
  <script>
    (async function () {
      try {
        await Store.init();
        Store.onChange(function () { UI.render(); });
        window.addEventListener('hashchange', function () { UI.render(); });
        UI.render();
      } catch (e) {
        console.error(e);
        document.getElementById('app').innerHTML = '<div style="padding:30px"><h1>Errore di avvio</h1><p>' + String(e.message || e) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
